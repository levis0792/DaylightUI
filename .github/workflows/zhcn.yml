name: Update zhCN translation

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zhcn-translation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: dayightt/DaylightUI
      TARGET_REPO: ${{ github.repository }}
      ZHCN_BRANCH: codex/zhcn-1.7
      API_KEY: ${{ secrets.API_KEY }}
      OPENAI_BASE_URL: https://ai.levis0792.cn:18787/v1
      OPENAI_MODEL: deepseek-v4.1-flash
    steps:
      - name: Check out the maintenance branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the author's current main
        id: upstream
        shell: bash
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main
          echo "sha=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Create a clean PR branch
        shell: bash
        run: |
          git switch -C "${ZHCN_BRANCH}" upstream/main
          git checkout main -- Locales/zhCN.lua tools/zhcn.js tools/zhcn-glossary.json tools/lib translations

      - name: Scan for missing zhCN strings
        id: missing
        shell: bash
        run: |
          if node tools/zhcn.js check | tee /tmp/zhcn-check.txt | grep -q "Untranslated: 0"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Translate missing strings with AI
        if: steps.missing.outputs.needed == 'true'
        run: node tools/zhcn.js translate

      - name: Validate the locale
        run: node tools/zhcn.js check

      - name: Upload translation review report
        if: steps.missing.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zhcn-ai-review
          path: tools/reports/zhcn-ai.json
          if-no-files-found: ignore

      - name: Commit the translation
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "DarkUI zhCN bot"
          git config user.email "zhcn-bot@users.noreply.github.com"
          git add -f Locales/zhCN.lua
          if git diff --cached --quiet; then
            echo "No translation change for ${UPSTREAM_SHA}"
            exit 0
          fi
          git commit -m "locale(zhCN): update from upstream ${UPSTREAM_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" "HEAD:${ZHCN_BRANCH}"
