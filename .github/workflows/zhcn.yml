name: Update zhCN translation

on:
  # GitHub schedules are best effort. The NAS is an optional extra trigger;
  # the state branch and concurrency group make duplicate triggers harmless.
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: "Upstream main SHA to translate"
        required: false
        type: string
      mode:
        description: "translate (incremental), consensus (missing only) or rebuild (all strings)"
        required: false
        default: "translate"
        type: choice
        options:
          - translate
          - consensus
          - rebuild
      trigger_note:
        description: "Run title marker used by the monitor to avoid duplicate runs"
        required: false
        type: string
      force:
        description: "Run even when upstream has not changed (true/false)"
        required: false
        default: "false"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zhcn.yml"
      - ".github/workflows/zhcn-validate.yml"
      - "tools/zhcn.js"
      - "tools/zhcn-glossary.json"
      - "tools/zhcn-overrides.json"
      - "tools/lib/**"
      - "tools/pr-summary.js"
      - "Locales/zhCN.lua"
      - "tests/test_zhcn_tool.js"
      - "tests/test_pr_summary.js"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: zhcn-translation
  cancel-in-progress: false

run-name: "zhCN ${{ inputs.trigger_note || inputs.upstream_sha || github.run_id }}"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UPSTREAM_REPO: dayightt/DaylightUI
      TARGET_REPO: ${{ github.repository }}
      ZHCN_BRANCH: automation/zhcn
      ZHCN_STATE_BRANCH: automation/zhcn-state
      API_KEY: ${{ secrets.API_KEY || secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://ai.levis0792.cn:18787/v1' }}
      OPENAI_MODEL: deepseek-v4.1-flash
      ZHCN_REVIEW_MODEL: deepseek-v4.1-flash
      ZHCN_REVIEW_FALLBACK_MODEL: deepseek-v4.1-flash
      ZHCN_REVIEW_LAST_MODEL: deepseek-v4.1-flash
      ZHCN_BATCH_SIZE: ${{ vars.ZHCN_BATCH_SIZE || '12' }}
      ZHCN_CONTEXT_LINES: ${{ vars.ZHCN_CONTEXT_LINES || '6' }}
      ZHCN_REVIEW: 'false'
      ZHCN_CONSENSUS_MODELS: deepseek-v4.1-flash
      ZHCN_JUDGE_MODEL: deepseek-v4.1-flash
      ZHCN_CONSENSUS_BATCH_SIZE: ${{ vars.ZHCN_CONSENSUS_BATCH_SIZE || '10' }}
      AI_RETRIES: ${{ vars.AI_RETRIES || '3' }}
      AI_RETRY_BASE_MS: ${{ vars.AI_RETRY_BASE_MS || '1500' }}
      AI_WORKFLOW_RETRIES: ${{ vars.AI_WORKFLOW_RETRIES || '3' }}
    steps:
      - name: Check out the translation maintenance branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether the author's sources changed
        id: changed
        shell: bash
        run: |
          # Cheap check for every trigger: read the author's main and the commit
          # the automation branch was last built from. When they match, stop
          # here and skip Node, the AI call and the PR work. A manual run can
          # still force a full pass with force=true.
          upstream_sha=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" refs/heads/main | awk '{print $1}')
          test -n "$upstream_sha" || { echo "::error::Could not read the author's main."; exit 1; }
          # The last processed SHA lives on its own branch, so polling never
          # touches the pull request branch and never invalidates the author's
          # approval of the pull request checks.
          last=""
          if git show "refs/remotes/origin/${ZHCN_STATE_BRANCH}:.upstream-sha" > /tmp/zhcn-state 2>/dev/null; then
            last=$(tr -d '[:space:]' < /tmp/zhcn-state)
          fi
          force="${{ inputs.force || 'false' }}"
          # A push to the maintenance branch must exercise the new tooling even
          # when the author's SHA has not moved.
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            force=true
          fi
          if [ "$force" != "true" ] && [ -n "$last" ] && [ "$last" = "$upstream_sha" ]; then
            echo "Upstream is still ${upstream_sha}; nothing to translate."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.changed.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run zhCN tool regression tests
        if: steps.changed.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in OPENAI_MODEL ZHCN_REVIEW_MODEL ZHCN_REVIEW_FALLBACK_MODEL ZHCN_REVIEW_LAST_MODEL ZHCN_CONSENSUS_MODELS ZHCN_JUDGE_MODEL; do
            test "${!name}" = 'deepseek-v4.1-flash' || {
              echo "::error::${name} must stay deepseek-v4.1-flash"
              exit 1
            }
          done
          node tests/test_zhcn_tool.js
          node tests/test_pr_summary.js

      - name: Install LuaJIT
        if: steps.changed.outputs.needed == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q luajit

      - name: Fetch the author's current main
        if: steps.changed.outputs.needed == 'true'
        id: upstream
        shell: bash
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main
          sha=$(git rev-parse upstream/main)
          short=$(git rev-parse --short "$sha")
          if [ -n "${{ inputs.upstream_sha }}" ] && [ "${{ inputs.upstream_sha }}" != "$sha" ]; then
            echo "::warning::Requested SHA changed; using current upstream $sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"

      - name: Restore translation checkpoint from state branch
        if: steps.changed.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/zhcn-checkpoint"
          if git show "refs/remotes/origin/${ZHCN_STATE_BRANCH}:.zhcn-checkpoint.json" > "${RUNNER_TEMP}/zhcn-checkpoint/checkpoint.json" 2>/dev/null; then
            echo "Restored translation checkpoint from ${ZHCN_STATE_BRANCH}."
          else
            echo "No saved translation checkpoint found."
          fi

      - name: Fetch the game's UI code for the author's runtime walker
        if: steps.changed.outputs.needed == 'true'
        run: python3 tools/fetch_blizzard.py

      - name: Stage the maintenance tools outside the PR branch
        if: steps.changed.outputs.needed == 'true'
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/zhcn-tools"
          mkdir -p "${RUNNER_TEMP}/zhcn-tools"
          cp -a tools "${RUNNER_TEMP}/zhcn-tools/tools"
          mkdir -p "${RUNNER_TEMP}/zhcn-tools/tests"
          cp -a tests/test_zhcn_tool.js "${RUNNER_TEMP}/zhcn-tools/tests/test_zhcn_tool.js"

      - name: Create the PR branch from the author's current main
        if: steps.changed.outputs.needed == 'true'
        shell: bash
        run: |
          # Keep the fork's copy as the merge source before switching branches.
          git show "origin/${ZHCN_BRANCH}:Locales/zhCN.lua" > "${RUNNER_TEMP}/zhcn-fork.lua" || git show main:Locales/zhCN.lua > "${RUNNER_TEMP}/zhcn-fork.lua"
          git switch -C "${ZHCN_BRANCH}" upstream/main
          test -f Locales/zhCN.lua

          # Export keys from the author's just-checked-out source, not the fork's.
          luajit tools/locale.lua keys > "${RUNNER_TEMP}/zhcn-keys.txt"
          # The automation branch is the reviewed baseline. Keep its wording for
          # every key the author still ships, drop keys the author removed, and
          # leave only genuinely new or reworded keys for the translation pass.
          ZHCN_KEYS_FILE="${RUNNER_TEMP}/zhcn-keys.txt" ZHCN_ROOT="$GITHUB_WORKSPACE" node "${RUNNER_TEMP}/zhcn-tools/tools/zhcn.js" sync "${RUNNER_TEMP}/zhcn-fork.lua"
          # A translation whose English key was removed must go too. The
          # author's own test_locale fails on such "no longer shown" rows.
          ZHCN_KEYS_FILE="${RUNNER_TEMP}/zhcn-keys.txt" ZHCN_ROOT="$GITHUB_WORKSPACE" node "${RUNNER_TEMP}/zhcn-tools/tools/zhcn.js" prune
          # Upstream can add a string that already exists; keep its last definition.
          ZHCN_KEYS_FILE="${RUNNER_TEMP}/zhcn-keys.txt" ZHCN_ROOT="$GITHUB_WORKSPACE" node "${RUNNER_TEMP}/zhcn-tools/tools/zhcn.js" dedupe
          # Force the reviewed terms (spacing, fixed game words) over whatever the author or AI has.
          if [ -f "${RUNNER_TEMP}/zhcn-tools/tools/zhcn-overrides.json" ]; then
            ZHCN_KEYS_FILE="${RUNNER_TEMP}/zhcn-keys.txt" ZHCN_ROOT="$GITHUB_WORKSPACE" node "${RUNNER_TEMP}/zhcn-tools/tools/zhcn.js" override "${RUNNER_TEMP}/zhcn-tools/tools/zhcn-overrides.json"
          fi
          echo "Base: the reviewed automation baseline, limited to the author current keys. New strings are translated below."

      - name: Scan current coverage
        if: steps.changed.outputs.needed == 'true'
        id: scan
        shell: bash
        run: |
          set +e
          ZHCN_KEYS_FILE="${RUNNER_TEMP}/zhcn-keys.txt" ZHCN_ROOT="$GITHUB_WORKSPACE" node "${RUNNER_TEMP}/zhcn-tools/tools/zhcn.js" check | tee /tmp/zhcn-check.txt
          code=${PIPESTATUS[0]}
          # A clean file needs no repair. Format errors, duplicate keys and
          # stale keys are deterministic work too; checking only one summary
          # line made those failures look like a no-op.
          if grep -q "^Untranslated: 0$" /tmp/zhcn-check.txt && \
             grep -q "^Removed keys: 0$" /tmp/zhcn-check.txt && \
             grep -q "^Duplicate keys: 0$" /tmp/zhcn-check.txt && \
             grep -q "^Format/empty errors: 0$" /tmp/zhcn-check.txt; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$code" -ne 0 ] && ! grep -q -E '^Untranslated: [1-9]|^Format/empty errors: [1-9]|^Duplicate keys: [1-9]|^Removed keys: [1-9]' /tmp/zhcn-check.txt; then
            exit "$code"
          fi

      - name: Check the translation endpoint configuration
        if: steps.changed.outputs.needed == 'true'
        id: endpoint
        env:
          CHECK_KEY: ${{ secrets.API_KEY || secrets.OPENAI_API_KEY }}
          CHECK_BASE: ${{ vars.OPENAI_BASE_URL || 'https://ai.levis0792.cn:18787/v1' }}
        shell: bash
        run: |
          if [ -z "$CHECK_KEY" ]; then
            echo "::error::No API key is available as API_KEY or OPENAI_API_KEY."
            exit 1
          fi
          echo "Translation endpoint: ${CHECK_BASE}"
          echo "API key is configured (length ${#CHECK_KEY})."
          ok=false
          attempt=0
          while [ "$attempt" -lt 3 ] && [ "$ok" != true ]; do
            attempt=$((attempt + 1))
            if curl --silent --show-error --fail-with-body --max-time 20 \
              -H "Authorization: Bearer ${CHECK_KEY}" \
              "${CHECK_BASE%/}/models" > /tmp/zhcn-models.json; then
              ok=true
            else
              code=$?
              echo "::warning::Translation endpoint attempt ${attempt}/3 failed (exit ${code})."
              [ "$attempt" -lt 3 ] && sleep $((5 * attempt))
            fi
          done
          if [ "$ok" = true ]; then
            echo "endpoint_ok=true" >> "$GITHUB_OUTPUT"
            echo "Translation endpoint responded successfully."
          else
            echo "endpoint_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Translation endpoint unavailable after 3 attempts; continuing in retry-only mode."
          fi

      - name: Translate missing or untranslated strings
        id: translate
        if: steps.scan.outputs.needed == 'true'
        env:
          ZHCN_CHECKPOINT: ${{ runner.temp }}/zhcn-checkpoint/checkpoint.json
          ZHCN_CHECKPOINT_SHA: ${{ steps.upstream.outputs.sha }}
          ZHCN_ROOT: ${{ github.workspace }}
        shell: bash
        run: |
          set -o pipefail
          attempts="${AI_WORKFLOW_RETRIES}"
          case "$attempts" in
            ""|*[!0-9]*) attempts=3 ;;
          esac
          [ "$attempts" -lt 1 ] && attempts=3
          [ "$attempts" -gt 10 ] && attempts=10
          attempt=0
          last_detail="unknown"
          while [ "$attempt" -lt "$attempts" ]; do
            attempt=$((attempt + 1))
            echo "::group::AI translation attempt ${attempt}/${attempts}"
            command=translate
            [ "${{ inputs.mode }}" = "consensus" ] && command=consensus
            [ "${{ inputs.mode }}" = "rebuild" ] && command=rebuild
            ZHCN_KEYS_FILE="${RUNNER_TEMP}/zhcn-keys.txt" node "${RUNNER_TEMP}/zhcn-tools/tools/zhcn.js" "$command" 2>&1 | tee /tmp/zhcn-ai.log
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            last_detail=$(tail -n 3 /tmp/zhcn-ai.log | tr "\n" " " | cut -c1-1000)
            if [ "$rc" -eq 0 ]; then
              echo "Translation succeeded on attempt ${attempt}."
              break
            fi
            echo "::warning::AI translation attempt ${attempt}/${attempts} failed: ${last_detail}"
            if [ "$attempt" -lt "$attempts" ]; then
              delay=$((10 * attempt * attempt))
              echo "Retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::AI translation failed after ${attempts} workflow attempts: ${last_detail}"
            echo "::notice::Locale was left unchanged; the next scheduled or manual run will retry the same upstream commit."
            exit "$rc"
          fi
          # translate() can have nothing to send while the scan still has a
          # dead key or an invalid value. Those are deterministic failures, not
          # AI outages; fail here instead of pushing a PR the author's tests reject.
          ZHCN_KEYS_FILE="${RUNNER_TEMP}/zhcn-keys.txt" ZHCN_ROOT="$GITHUB_WORKSPACE" node "${RUNNER_TEMP}/zhcn-tools/tools/zhcn.js" check

      - name: Upload AI translation output
        if: always() && steps.changed.outputs.needed == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: zhcn-ai-log-${{ github.run_id }}
          path: /tmp/zhcn-ai.log
          if-no-files-found: ignore

      - name: Upload translation checkpoint
        if: always() && steps.changed.outputs.needed == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: zhcn-checkpoint-${{ github.run_id }}
          path: ${{ runner.temp }}/zhcn-checkpoint/checkpoint.json
          if-no-files-found: ignore

      - name: Validate the author-facing file strictly
        if: always() && steps.changed.outputs.needed == 'true' && steps.translate.outcome == 'success'
        env:
          ZHCN_ROOT: ${{ github.workspace }}
        run: ZHCN_KEYS_FILE="${RUNNER_TEMP}/zhcn-keys.txt" node "${RUNNER_TEMP}/zhcn-tools/tools/zhcn.js" check

      - name: Run the author's own locale test
        if: always() && steps.changed.outputs.needed == 'true'
        shell: bash
        run: |
          # This is the author's gate for a locale-only PR: it catches keys the
          # source no longer ships, holes/code mismatches, and loader errors.
          luajit tests/run.lua --par --only test_locale

      - name: Test deduplication, routing and translator retry handling
        if: steps.changed.outputs.needed == 'true'
        env:
          ZHCN_ROOT: ${{ github.workspace }}
          ZHCN_TOOL_ROOT: ${{ runner.temp }}/zhcn-tools
        shell: bash
        run: |
          set -euo pipefail
          API_KEY=test-key ZHCN_KEYS_FILE="${RUNNER_TEMP}/zhcn-keys.txt" node "${RUNNER_TEMP}/zhcn-tools/tests/test_zhcn_tool.js"

      - name: Upload consensus checkpoint
        if: always() && steps.changed.outputs.needed == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: zhcn-consensus-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zhcn-tools/tools/reports/zhcn-consensus.json
            ${{ runner.temp }}/zhcn-tools/tools/reports/zhcn-consensus-all.json
          if-no-files-found: ignore

      - name: Write the final status summary
        if: always() && steps.changed.outputs.needed == 'true'
        shell: bash
        env:
          OUTCOME_CHANGED: ${{ steps.changed.outcome }}
          OUTCOME_SCAN: ${{ steps.scan.outcome }}
          OUTCOME_ENDPOINT: ${{ steps.endpoint.outcome }}
          OUTCOME_TRANSLATE: ${{ steps.translate.outcome }}
          OUTCOME_CHANGES: ${{ steps.changes.outcome }}
          OUTCOME_PULL: ${{ steps.pull.outcome }}
        run: |
          {
            echo "## zhCN automation status"
            echo
            echo "- Changed check: ${OUTCOME_CHANGED:-not-run}"
            echo "- Coverage scan: ${OUTCOME_SCAN:-not-run}"
            echo "- Endpoint check: ${OUTCOME_ENDPOINT:-not-run}"
            echo "- Translation: ${OUTCOME_TRANSLATE:-not-run}"
            echo "- Commit: ${OUTCOME_CHANGES:-not-run}"
            echo "- Upstream PR: ${OUTCOME_PULL:-not-run}"
            echo
            echo "The processed SHA is recorded only after a successful PR update."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload translation review report
        if: steps.changed.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zhcn-ai-review-${{ steps.upstream.outputs.short }}
          path: ${{ runner.temp }}/zhcn-tools/tools/reports/zhcn-ai.json
          if-no-files-found: ignore

      - name: Commit the translation
        if: steps.changed.outputs.needed == 'true'
        id: changes
        env:
          UPSTREAM_SHORT: ${{ steps.upstream.outputs.short }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DarkUI zhCN bot"
          git config user.email "zhcn-bot@users.noreply.github.com"
          git add Locales/zhCN.lua
          if git diff --cached --quiet; then
            echo "No source translation change for ${UPSTREAM_SHORT}"
            # Do not touch the pull request branch: a new commit would throw
            # away the author's approval of the pull request checks.
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "locale(zhCN): update for upstream ${UPSTREAM_SHORT}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" "HEAD:${ZHCN_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify the PR contains only the locale
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          extra=$(git diff --name-only upstream/main...HEAD | grep -v '^Locales/zhCN.lua$' || true)
          test -z "$extra" || {
            echo "::error::The PR must change only Locales/zhCN.lua; got: $extra"
            exit 1
          }

      - name: Prepare the upstream pull request description
        if: steps.changes.outputs.changed == 'true'
        id: description
        shell: bash
        run: |
          set -euo pipefail
          base="main"
          UPSTREAM_SHORT=$(git -C "${GITHUB_WORKSPACE}" rev-parse --short upstream/main)
          test -n "$UPSTREAM_SHORT" || { echo "::error::Upstream short SHA is empty."; exit 1; }
          LOCALE_PATH=$(git -C "${GITHUB_WORKSPACE}" diff --name-only "upstream/${base}...HEAD" -- Locales/zhCN.lua)
          test "$LOCALE_PATH" = "Locales/zhCN.lua" || { echo "::error::Unexpected locale path: ${LOCALE_PATH:-empty}"; exit 1; }
          locale_diff=$(git diff "upstream/${base}...HEAD" -- Locales/zhCN.lua)
          title="locale(zhCN): update Simplified Chinese translations"
          summary=$(printf '%s\n' "$locale_diff" | node "${RUNNER_TEMP}/zhcn-tools/tools/pr-summary.js")
          ZHCN_ROOT="$GITHUB_WORKSPACE" ZHCN_KEYS_FILE="${RUNNER_TEMP}/zhcn-keys.txt" node "${RUNNER_TEMP}/zhcn-tools/tools/zhcn.js" check > /tmp/zhcn-final.txt
          test -s /tmp/zhcn-final.txt || { echo "::error::Final zhCN check did not produce output."; exit 1; }
          grep -q "^Missing keys: 0$" /tmp/zhcn-final.txt
          grep -q "^Untranslated: 0$" /tmp/zhcn-final.txt
          grep -q "^Duplicate keys: 0$" /tmp/zhcn-final.txt
          grep -q "^Format/empty errors: 0$" /tmp/zhcn-final.txt
          grep -q "^Removed keys: 0$" /tmp/zhcn-final.txt

          validation=$(awk '/^(Missing keys|Untranslated|Duplicate keys|Format\/empty errors):/ {gsub(": ", " "); printf "%s; ", $0}' /tmp/zhcn-final.txt | sed 's/; $//')

          {
            echo "## Simplified Chinese translation update"
            echo
            echo "Update the Simplified Chinese locale for upstream commit \`${UPSTREAM_SHORT}\`."
            echo
            printf '%s\n' "${summary:-No translation entries changed.}"
            echo
            echo "**Validation:** ${validation:-passed}"
            echo
            echo "Only \`${LOCALE_PATH}\` changes. No Lua logic, layouts, or non-locale files are changed."
          } > "${RUNNER_TEMP}/zhcn-pr-body.md"
          test -s "${RUNNER_TEMP}/zhcn-pr-body.md"
          grep -Fq "${UPSTREAM_SHORT}" "${RUNNER_TEMP}/zhcn-pr-body.md"
          grep -Fq "${LOCALE_PATH}" "${RUNNER_TEMP}/zhcn-pr-body.md"

      - name: Create or update the upstream pull request
        if: steps.changes.outputs.changed == 'true'
        id: pull
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/zhcn-pr-body.md" || { echo "::error::Prepared PR body is missing."; exit 1; }
          head="${GITHUB_REPOSITORY_OWNER}:${ZHCN_BRANCH}"
          title="locale(zhCN): update Simplified Chinese translations"
          number=$(gh api "repos/${UPSTREAM_REPO}/pulls?state=open&head=${head}" --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            number=$(gh api --method POST "repos/${UPSTREAM_REPO}/pulls" \
              -f title="$title" \
              -f head="$head" \
              -f base="main" \
              -F body=@"$RUNNER_TEMP/zhcn-pr-body.md" \
              --jq '.number')
            echo "Opened pull request #${number}."
          else
            gh api --method PATCH "repos/${UPSTREAM_REPO}/pulls/${number}" \
              -f title="$title" \
              -F body=@"$RUNNER_TEMP/zhcn-pr-body.md" >/dev/null
            echo "Updated pull request #${number}."
          fi
          echo "https://github.com/${UPSTREAM_REPO}/pull/${number}"
          test -n "$number" || { echo "::error::The PR number was not returned."; exit 1; }
          echo "url=https://github.com/${UPSTREAM_REPO}/pull/${number}" >> "$GITHUB_OUTPUT"

      - name: Save checkpoint to state branch after translation failure
        if: always() && steps.changed.outputs.needed == 'true' && steps.translate.outcome == 'failure' && steps.upstream.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file="${RUNNER_TEMP}/zhcn-checkpoint/checkpoint.json"
          if [ ! -s "$file" ]; then
            echo "No checkpoint to save."
            exit 0
          fi
          state=$(mktemp -d)
          cd "$state"
          git init -q
          git config user.name "DarkUI zhCN bot"
          git config user.email "zhcn-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"
          git fetch -q origin "${ZHCN_STATE_BRANCH}"
          git checkout -q -B state FETCH_HEAD
          cp "$file" ./.zhcn-checkpoint.json
          git add .zhcn-checkpoint.json
          if git diff --cached --quiet; then
            echo "Checkpoint unchanged."
            exit 0
          fi
          git commit -q -m "state: translation checkpoint ${{ steps.upstream.outputs.short }}"
          git push --force origin "HEAD:${ZHCN_STATE_BRANCH}"

      - name: Record the processed upstream commit
        if: always() && steps.changed.outputs.needed == 'true' && steps.changes.outcome == 'success' && steps.changes.outputs.changed == 'true' && steps.pull.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Record only after the locale was pushed and the PR was verified.
          # A failed PR/token call leaves this SHA pending for the next run.
          state=$(mktemp -d)
          cd "$state"
          git init -q
          git config user.name "DarkUI zhCN bot"
          git config user.email "zhcn-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"
          git fetch -q origin "${ZHCN_STATE_BRANCH}"
          git checkout -q -B state FETCH_HEAD
          printf '%s\n' "${{ steps.upstream.outputs.sha }}" > .upstream-sha
          checkpoint="${RUNNER_TEMP}/zhcn-checkpoint/checkpoint.json"
          if [ -s "$checkpoint" ]; then
            cp "$checkpoint" ./.zhcn-checkpoint.json
            echo "Keeping the active translation checkpoint in the state branch."
          else
            git rm -q --cached .zhcn-checkpoint.json 2>/dev/null || true
            rm -f .zhcn-checkpoint.json
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "State unchanged."
            exit 0
          fi
          git commit -q -m "state: upstream ${{ steps.upstream.outputs.short }}"
          git push --force origin "HEAD:${ZHCN_STATE_BRANCH}"
