name: Update zhCN translation

on:
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: "Upstream main SHA to translate"
        required: false
        type: string
      trigger_note:
        description: "Run title marker used by the monitor to avoid duplicate runs"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zhcn.yml"
      - "tools/zhcn.js"
      - "tests/test_zhcn_tool.js"

permissions:
  contents: write

concurrency:
  group: zhcn-translation
  cancel-in-progress: false

run-name: "zhCN ${{ inputs.trigger_note || inputs.upstream_sha || github.run_id }}"

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: dayightt/DaylightUI
      TARGET_REPO: ${{ github.repository }}
      ZHCN_BRANCH: automation/zhcn
      API_KEY: ${{ secrets.API_KEY || secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://ai.levis0792.cn:18787/v1' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'deepseek-v4.1-flash' }}
      AI_RETRIES: ${{ vars.AI_RETRIES || '3' }}
      AI_RETRY_BASE_MS: ${{ vars.AI_RETRY_BASE_MS || '1500' }}
    steps:
      - name: Check out the translation maintenance branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the author's current main
        id: upstream
        shell: bash
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main
          sha=$(git rev-parse upstream/main)
          short=$(git rev-parse --short "$sha")
          if [ -n "${{ inputs.upstream_sha }}" ] && [ "${{ inputs.upstream_sha }}" != "$sha" ]; then
            echo "::warning::Requested SHA changed; using current upstream $sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"

      - name: Stage the maintenance tools outside the PR branch
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/zhcn-tools"
          mkdir -p "${RUNNER_TEMP}/zhcn-tools"
          cp -a tools "${RUNNER_TEMP}/zhcn-tools/tools"

      - name: Create the PR branch from the author's current main
        shell: bash
        run: |
          git switch -C "${ZHCN_BRANCH}" upstream/main
          git checkout main -- Locales/zhCN.lua
          test -f Locales/zhCN.lua

      - name: Scan current coverage
        id: scan
        shell: bash
        run: |
          set +e
          ZHCN_ROOT="$GITHUB_WORKSPACE" node "${RUNNER_TEMP}/zhcn-tools/tools/zhcn.js" check | tee /tmp/zhcn-check.txt
          code=${PIPESTATUS[0]}
          if grep -q "Untranslated: 0" /tmp/zhcn-check.txt; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$code" -ne 0 ] && [ "$(grep -c '^Missing keys:\|^English leftovers:' /tmp/zhcn-check.txt)" -eq 0 ]; then
            exit "$code"
          fi

      - name: Check the translation endpoint configuration
        env:
          CHECK_KEY: ${{ secrets.API_KEY || secrets.OPENAI_API_KEY }}
          CHECK_BASE: ${{ vars.OPENAI_BASE_URL || 'https://ai.levis0792.cn:18787/v1' }}
        shell: bash
        run: |
          if [ -z "$CHECK_KEY" ]; then
            echo "::error::No API key is available as API_KEY or OPENAI_API_KEY."
            exit 1
          fi
          echo "Translation endpoint: ${CHECK_BASE}"
          echo "API key is configured (length ${#CHECK_KEY})."
          curl --silent --show-error --fail-with-body --max-time 20 \
            -H "Authorization: Bearer ${CHECK_KEY}" \
            "${CHECK_BASE%/}/models" > /tmp/zhcn-models.json || {
              code=$?
              echo "::error::Translation endpoint check failed with exit code ${code}."
              exit "$code"
            }
          echo "Translation endpoint responded successfully."

      - name: Translate missing or untranslated strings
        if: steps.scan.outputs.needed == 'true'
        env:
          ZHCN_ROOT: ${{ github.workspace }}
        shell: bash
        run: |
          set -o pipefail
          node "${RUNNER_TEMP}/zhcn-tools/tools/zhcn.js" translate 2>&1 | tee /tmp/zhcn-ai.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            detail=$(tail -n 3 /tmp/zhcn-ai.log | tr "\n" " " | cut -c1-1000)
            echo "::error::AI translation failed: ${detail}"
            exit "$rc"
          fi

      - name: Upload AI translation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhcn-ai-log-${{ github.run_id }}
          path: /tmp/zhcn-ai.log
          if-no-files-found: ignore

      - name: Validate the author-facing file strictly
        env:
          ZHCN_ROOT: ${{ github.workspace }}
        run: node "${RUNNER_TEMP}/zhcn-tools/tools/zhcn.js" check

      - name: Test the translator's glossary and retry handling
        env:
          ZHCN_ROOT: ${{ github.workspace }}
          ZHCN_TOOL_ROOT: ${{ runner.temp }}/zhcn-tools
        shell: bash
        run: |
          set -euo pipefail
          API_KEY=test-key node -e '
            const assert = require("node:assert/strict");
            const path = require("node:path");
            const tool = require(path.join(process.env.ZHCN_TOOL_ROOT, "tools", "zhcn.js"));
            const glossary = tool.readGlossary();
            assert.equal(glossary["Focus Target"], "焦点目标");
            assert.equal(glossary["tooltip"], "鼠标提示");
            assert.equal(tool.retryable({ status: 503 }), true);
            assert.equal(tool.retryable({ status: 429 }), true);
            assert.equal(tool.retryable({ status: 400 }), false);
            let calls = 0;
            const waits = [];
            const ok = { ok: true, status: 200, text: async () => JSON.stringify({ choices: [{ message: { content: JSON.stringify({ Ready: "就绪" }) } }] }) };
            const bad = { ok: false, status: 503, text: async () => "down" };
            tool.requestBatch([["Ready", "test.lua:1"]], { exact: new Map() }, { retries: 3, wait: async (ms) => waits.push(ms), fetchImpl: async () => (++calls < 3 ? bad : ok) }).then((result) => {
              assert.deepEqual(result, { Ready: "就绪" });
              assert.equal(calls, 3);
              assert.deepEqual(waits, [1500, 3000]);
              console.log("zhCN tool regression passed");
            }).catch((error) => { console.error(error.stack || error); process.exit(1); });
          '

      - name: Upload translation review report
        uses: actions/upload-artifact@v4
        with:
          name: zhcn-ai-review-${{ steps.upstream.outputs.short }}
          path: ${{ runner.temp }}/zhcn-tools/tools/reports/zhcn-ai.json
          if-no-files-found: ignore

      - name: Commit the translation
        id: changes
        env:
          UPSTREAM_SHORT: ${{ steps.upstream.outputs.short }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DarkUI zhCN bot"
          git config user.email "zhcn-bot@users.noreply.github.com"
          git add Locales/zhCN.lua
          if git diff --cached --quiet; then
            echo "No source translation change for ${UPSTREAM_SHORT}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "locale(zhCN): update for upstream ${UPSTREAM_SHORT}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" "HEAD:${ZHCN_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify the PR contains only the locale
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          changed=$(git diff --name-only upstream/main...HEAD)
          test "$changed" = "Locales/zhCN.lua" || {
            echo "::error::The PR must change only Locales/zhCN.lua; got: $changed"
            exit 1
          }

      - name: Create the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_PR_TOKEN is not configured; the automation branch was pushed, but no PR can be created."
            exit 1
          fi
          UPSTREAM_SHORT=$(git rev-parse --short upstream/main)

          existing=$(gh pr list \
            --repo "${UPSTREAM_REPO}" \
            --head "${TARGET_REPO%%/*}:${ZHCN_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$existing" ]; then
            open_count=$(gh pr list --repo "${UPSTREAM_REPO}" --state open --limit 100 --json number --jq 'length')
            if [ "$open_count" -ge 50 ]; then
              echo "::error::The author already has ${open_count} open PRs; cannot create a new one."
              exit 1
            fi
          fi

          body=$(cat <<EOF
          Automated Simplified Chinese localization update for upstream `${UPSTREAM_SHORT}`.

          The workflow is designed to stay current as the author publishes new releases:
          it reuses one automation branch and updates the same PR instead of opening a
          new PR for every upstream commit.

          Validation before the commit and PR:
          - Coverage: no missing keys, English leftovers, duplicate keys, or format errors
          - Glossary and AI retry regression test: passed
          - Author's native locale test: `luajit tests/run.lua --only test_locale`: passed

          Only `Locales/zhCN.lua` changes in the PR. No source files, settings or behavior
          are changed. Later author updates merge the latest `main` into this branch and
          translate whatever new text appears; if there is no new visible text, the diff
          stays unchanged.
          EOF
          )

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "${UPSTREAM_REPO}" --title "locale(zhCN): complete Simplified Chinese for ${UPSTREAM_SHORT}" --body "$body"
          else
            gh pr create \
              --repo "${UPSTREAM_REPO}" \
              --base main \
              --head "${TARGET_REPO%%/*}:${ZHCN_BRANCH}" \
              --title "locale(zhCN): complete Simplified Chinese for ${UPSTREAM_SHORT}" \
              --body "$body"
          fi