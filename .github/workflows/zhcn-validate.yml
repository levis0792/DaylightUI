name: Validate zhCN

on:
  push:
    branches:
      - codex/zhcn-runtime-keys

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install LuaJIT
        run: sudo apt-get update -q && sudo apt-get install -y -q luajit
      - name: Fetch the game's UI code for the runtime walker
        run: python3 tools/fetch_blizzard.py
      - name: Export the author's runtime UI key set
        run: luajit tools/locale.lua keys > "${RUNNER_TEMP}/zhcn-keys.txt"
      - name: Fail closed if the runtime key file is missing
        shell: bash
        run: |
          test -s "${RUNNER_TEMP}/zhcn-keys.txt" || {
            echo "::error::The author's runtime key set was not extracted.";
            exit 1
          }

      - name: Validate complete locale coverage
        shell: bash
        run: |
          set +e
          ZHCN_KEYS_FILE="${RUNNER_TEMP}/zhcn-keys.txt" node tools/zhcn.js check 2>&1 | tee /tmp/zhcn-check.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::zhCN check failed:"
            tail -n 60 /tmp/zhcn-check.txt || true
            exit "$code"
          fi
          echo "zhCN check passed"
