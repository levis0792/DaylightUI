name: Monitor DaylightUI main

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zhcn-monitor.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: daylightui-upstream-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read the author's current main SHA
        id: upstream
        shell: bash
        run: |
          sha=$(git ls-remote https://github.com/dayightt/DaylightUI.git refs/heads/main | awk '{print $1}')
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Trigger the translation workflow
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        shell: bash
        run: |
          gh workflow run zhcn.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f upstream_sha="$UPSTREAM_SHA"