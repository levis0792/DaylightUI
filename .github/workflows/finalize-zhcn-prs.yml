name: Verify zhCN maintenance PR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PR_TOKEN }}
      UPSTREAM: dayightt/DaylightUI
      HEAD_BRANCH: levis0792:automation/zhcn
    steps:
      - name: Verify the single maintained pull request
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_PR_TOKEN is not configured."
            exit 1
          fi

          result=$(gh api "repos/${UPSTREAM}/pulls?state=open&head=${HEAD_BRANCH}" --jq '.[0] // empty')
          if [ -z "$result" ]; then
            echo "::error::No open zhCN maintenance PR exists for ${HEAD_BRANCH}."
            exit 1
          fi

          number=$(jq -r '.number' <<<"$result")
          base=$(jq -r '.base.ref' <<<"$result")
          if [ "$base" != "main" ]; then
            echo "::error::PR #${number} targets ${base}, expected main."
            exit 1
          fi

          echo "The single maintained zhCN PR is #${number}, targeting ${base}."
